name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WindowsDiagnosticsCli.slnx

      - name: Build
        run: dotnet build WindowsDiagnosticsCli.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test WindowsDiagnosticsCli.slnx --configuration Release --no-build --verbosity normal
